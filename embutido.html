<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC CSS Embutido</title>
    <style>
        em{
            color: orange;
        }
        code{
            color: lime; 
            text-decoration: underline;
            /*front-family: sans-serif;*/
        }
    </style>
</head>
<body>
    <main>
        <h1>DCC202 Embutido</h1>
        <p>Você pode aplicar um estilo <em>Embutido</em> para um elemento usando 
            <code>style</code></p>
        <code>color</code>
        <p>Cor texto de elemento.</p>
        <code>background-color</code>
        <p>Cor de fundo do elemento.</p>
    </main>    
</body>

</html>
