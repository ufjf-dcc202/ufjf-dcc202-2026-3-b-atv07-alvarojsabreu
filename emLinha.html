<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC CSS Em linha</title>
</head>
<body>
<main>
        <h1>DCC202 Em linha</h1>
        <p>Você pode aplicar um estilo <em style="color: orange;"">em linha</em> para um elemento usando 
            <code style="color: lime; text-decoration: underline; font-family: sans-serif;">style</code></p>
        <code>color</code>
        <p>Cor texto de elemento.</p>
        <code>background-color</code>
        <p style="background-color: orangered">Cor de fundo do elemento.</p>
</main>    
</body>

</html>
